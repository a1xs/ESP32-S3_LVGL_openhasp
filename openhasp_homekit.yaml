# Helpers used in popups
input_number:
  plate_timer_minute:
    name: "plate_timer_minute"
    initial: 0
    min: 0
    max: 59
    step: 1
  plate_timer_hour:
    name: "plate_timer_hour"
    initial: 0
    min: 0
    max: 12
    step: 1
  plate_thermostat:
    name: "plate_thermostat"
    initial: 20
    min: 10
    max: 30
    step: 0.5
  time_working:
    name: "time_working"
    initial: 0
    min: 0
    max: 90
    step: 5

input_text:
  plate_sel_entity:
    name: "plate_sel_entity"
    initial: "Null"

openhasp:
  plate04:
    objects:
      # All Pages - Clock
      - obj: "p0b1"
        properties:
          "text": '{{ as_timestamp(now())|timestamp_custom("%H:%M") }}'
          
      # All Pages - Display off button
      - obj: "p0b2"
        event:
          "up":
            - service: openhasp.command
              target:
                entity_id: openhasp.plate04
              data:
                keyword: backlight
                parameters: "off"
      
      # All Pages - Mute button or BED Time ON
      - obj: "p0b3"
        properties:
          "text": '{{ "\uE75F" if is_state("input_boolean.mute", "on") or is_state("binary_sensor.bedtime", "on") else "\uE57E" }}'
          "text_color": '{{ "#ff9e00" if is_state("input_boolean.mute", "on") or is_state("binary_sensor.bedtime", "on") else "#FFF" }}'
        event:
          "up":
            - service: input_boolean.toggle
              target:
                entity_id: input_boolean.mute
      
      
      # All Pages - Navigation buttons
      - obj: "p0b10"
        properties:
          "text_color": '{{ "#ff9e00" if is_state("number.plate04_page_number", "1") else "#FFF" }}'
      - obj: "p0b11"
        properties:
          "text_color": '{{ "#ff9e00" if is_state("number.plate04_page_number", "2") else "#FFF" }}'
      - obj: "p0b12"
        properties:
          "text_color": '{{ "#ff9e00" if is_state("number.plate04_page_number", "3") else "#FFF" }}'
      - obj: "p0b13"
        properties:
          "text_color": '{{ "#ff9e00" if is_state("number.plate04_page_number", "4") else "#FFF" }}'
      
      # All Pages - Settings button (page 5)
      - obj: "p0b4"
        properties:
          "text_color": '{{ "#ff9e00" if is_state("number.plate04_page_number", "5") else "#FFF" }}'

      # Page 0: Sensors Panel
      
      - obj: "p0b21"  # Window bedrooom
        properties:
          "text_color": >
            {% if states("binary_sensor.0x00158d0007eb4fee_contact") in ["unavailable", "unknown"] %}#FF0000
            {% elif is_state("binary_sensor.0x00158d0007eb4fee_contact", "on") %}#FF9800
            {% else %}#4CAF50
            {% endif %}      

      - obj: "p0b22"  # Motion sensor
        properties:
          "text_color": >
            {% if states("binary_sensor.0x00158d0008382207_occupancy") in ["unavailable", "unknown"] %}#FF0000
            {% elif is_state("binary_sensor.0x00158d0008382207_occupancy", "on") %}#FF9800
            {% else %}#4CAF50
            {% endif %}
            
      - obj: "p0b23"  # Window Bathroom
        properties:
          "text_color": >
            {% if states("binary_sensor.0x00158d0007eb0727_contact") in ["unavailable", "unknown"] %}#FF0000
            {% elif is_state("binary_sensor.0x00158d0007eb0727_contact", "on") %}#FF9800
            {% else %}#4CAF50
            {% endif %}
      
      - obj: "p0b24"  # Door sensor
        properties:
          "text_color": >
            {% if states("binary_sensor.0x00158d0007e96266_contact") in ["unavailable", "unknown"] %}#FF0000
            {% elif is_state("binary_sensor.0x00158d0007e96266_contact", "on") %}#FF9800
            {% else %}#4CAF50
            {% endif %}
          "text": '{{ "\uE81B" if is_state("binary_sensor.0x00158d0007e96266_contact", "off") else "\uE81C" }}'

      - obj: "p0b25"  # Window Livingroom
        properties:
          "text_color": >
            {% if states("binary_sensor.0x00158d0007e91117_contact") in ["unavailable", "unknown"] %}#FF0000
            {% elif is_state("binary_sensor.0x00158d0007e91117_contact", "on") %}#FF9800
            {% else %}#4CAF50
            {% endif %}

      - obj: "p0b26"  # Window Kitchen
        properties:
          "text_color": >
            {% if states("binary_sensor.0x00158d0009c8a8ef_contact") in ["unavailable", "unknown"] %}#FF0000
            {% elif is_state("binary_sensor.0x00158d0009c8a8ef_contact", "on") %}#FF9800
            {% else %}#4CAF50
            {% endif %}
            
      - obj: "p0b27"  # Window Reserve
        properties:
          "text_color": >
            {% if states("binary_sensor.0x001_contact") in ["unavailable", "unknown"] %}#FF0000
            {% elif is_state("binary_sensor.0x001_contact", "on") %}#FF9800
            {% else %}#4CAF50
            {% endif %}

      # Page 1: Weather & Climate
      - obj: "p1b12" # Weather icon
        properties:
          #"text": '{{ "\uE599" if states("weather.home_assistant_2") == "sunny" else "\uE594" if states("weather.home_assistant_2") == "clear-night" else "\uE5A8" if states("weather.home_assistant_2") in ["partlycloudy", "cloudy"] else "\uE026" if states("weather.home_assistant_2") in ["rainy", "pouring"] else "\uE717" if states("weather.home_assistant_2") == "snowy" else "\uE5A8" }}'
          
          "src": '{{ "L:/w-sunny.png" if states("weather.home_assistant_2") == "sunny" else "L:/w-clear-night.png" if states("weather.home_assistant_2") == "clear-night" else "L:/w-cloudy.png" if states("weather.home_assistant_2") == "cloudy" else "L:/w-partlycloudy.png" if states("weather.home_assistant_2") == "partlycloudy" else "L:/w-rainy.png" if states("weather.home_assistant_2") == "rainy" else "L:/w-pouring.png" if states("weather.home_assistant_2") == "pouring" else "L:/w-lightning-rainy.png" if states("weather.home_assistant_2") == "lightning-rainy" else "L:/w-lightning.png" if states("weather.home_assistant_2") == "lightning" else "L:/w-storm.png" if states("weather.home_assistant_2") == "storm" else "L:/w-snowy.png" if states("weather.home_assistant_2") == "snowy" else "L:/w-snowy-rainy.png" if states("weather.home_assistant_2") == "snowy-rainy" else "L:/w-hail.png" if states("weather.home_assistant_2") == "hail" else "L:/w-foggy.png" if states("weather.home_assistant_2") == "fog" else "L:/w-windy.png" if states("weather.home_assistant_2") == "windy" else "L:/w-windy-variant.png" if states("weather.home_assistant_2") == "windy-variant" else "L:/w-exceptional.png" if states("weather.home_assistant_2") == "exceptional" else "L:/w-cloudy.png" }}'
          
          
      - obj: "p1b13" # Weather temperature
        properties:
          "text": '{{ state_attr("weather.home_assistant_2", "temperature") | round(1) }}°C'
      
      - obj: "p1b14" # Weather humidity
        properties:
          "text": '{{ state_attr("weather.home_assistant_2", "humidity") | round(0) }}%'
      
      - obj: "p1b15" # Weather label
        properties:
          "text": '{{ states("weather.home_assistant_2") | title }}'
        
      - obj: "p1b21" # Wind card background color
        properties:
          "bg_color": >
            {% set speed = states('sensor.wind_speed_wcom') | float(0) %}
            {% if speed < 20 %}#00FF00
            {% elif speed >= 20 and speed < 40 %}#FFFF00
            {% elif speed >= 40 and speed < 60 %}#FF7F50
            {% else %}#FF0000
            {% endif %}
    

      - obj: "p1b23" # Wind direction and speed
        properties:
          "text": >
            {% set bearing = states('sensor.wind_bearing_wcom') | float(0) %}
            {% set speed = states('sensor.wind_speed_wcom') | round(1) %}
            {% if bearing >= 337.5 or bearing < 22.5 %}N
            {% elif bearing >= 22.5 and bearing < 67.5 %}NE
            {% elif bearing >= 67.5 and bearing < 112.5 %}E
            {% elif bearing >= 112.5 and bearing < 157.5 %}SE
            {% elif bearing >= 157.5 and bearing < 202.5 %}S
            {% elif bearing >= 202.5 and bearing < 247.5 %}SW
            {% elif bearing >= 247.5 and bearing < 292.5 %}W
            {% elif bearing >= 292.5 and bearing < 337.5 %}NW
            {% else %}--
            {% endif %} {{ speed }}
            
      - obj: "p1b31" # Outdoor temperature card background color
        properties:
          "bg_color": >
            {% set temp = states('sensor.ac_ac_outdoor_temperature') | float(0) %}
            {% if temp < 5 %}#0000FF
            {% elif temp >= 5 and temp < 18 %}#FFFF00
            {% elif temp >= 18 and temp < 30 %}#00FF00
            {% elif temp >= 30 and temp < 35 %}#FFA500
            {% else %}#FF0000
            {% endif %}


      - obj: "p1b33" # Outdoor temperature
        properties:
          "text": '{{ states("sensor.ac_ac_outdoor_temperature") | round(1) }}°C'
      
      - obj: "p1b41" # CO2 background color
        properties:
          "bg_color": >
            {% set co2 = states('sensor.co2_sensor_co2') | int(0) %}
            {% if co2 < 1300 %}#00FF00
            {% elif co2 >= 1300 and co2 < 2500 %}#FFFF00
            {% else %}#FF0000
            {% endif %}
        event:
          "up":
            - service: homeassistant.toggle
              target:
                entity_id: light.s_u_esp_2r_led_1
      
      - obj: "p1b42" # CO2 icon (changes based on light state)
        properties:
          "text": '{{ "\uE6E8" if is_state("light.s_u_esp_2r_led_1", "on") else "\uE335" }}'
          "text_color": '{{ "#fb9b06" if is_state("light.s_u_esp_2r_led_1", "on") else "#FFF" }}'
      
      - obj: "p1b43" # CO2 value
        properties:
          "text": >-
            {% if is_state("sensor.co2_sensor_co2", "unavailable") %}
              N/A
            {% else %}
              {{ states("sensor.co2_sensor_co2") | round(0) }}
            {% endif %}

      # Page 2: Kitchen
      - obj: "p2b11" # Kitchen temperature
        properties:
          "value_str": '{{ states("sensor.atc_6781_temperature") | round(1) }}°C'
      - obj: "p2b21" # Kitchen humidity
        properties:
          "value_str": '{{ states("sensor.atc_6781_humidity") | round(0) }}%'
      
      - obj: "p2b61" # Kitchen heater card
        properties:
          "bg_color": '{{ "#FFF" if is_state("climate.kitchen_heater", "heat") else "#000" }}'
          "bg_opa": '{{ "255" if is_state("climate.kitchen_heater", "heat") else "128" }}'
        event:
          "up":
            - service: script.plate_heater_popup
              data:
                entity_name: "Kitchen Heater"
                entity_id: "climate.kitchen_heater"
                entity_icon: "\uE438"
      - obj: "p2b62" # Kitchen heater icon
        properties:
          "text_color": '{{ "#ff9e00" if is_state("climate.kitchen_heater", "heat") else "#FFF" }}'
          "opacity": '{{ "255" if is_state("climate.kitchen_heater", "heat") else "128" }}'
      - obj: "p2b63" # Kitchen heater label
        properties:
          "text_color": '{{ "#000" if is_state("climate.kitchen_heater", "heat") else "#FFF" }}'
          "opacity": '{{ "255" if is_state("climate.kitchen_heater", "heat") else "128" }}'
      - obj: "p2b64" # Kitchen heater status
        properties:
          "text": >
            {% if is_state("climate.kitchen_heater", "unavailable") %}N/A
            {% elif is_state("climate.kitchen_heater", "heat") %}{{ state_attr("climate.kitchen_heater", "temperature") | round(1) }}°C
            {% else %}Off
            {% endif %}
          "text_color": '{{ "#000" if is_state("climate.kitchen_heater", "heat") else "#FFF" }}'
      
      - obj: "p2b71" # AC card
        properties:
          "bg_color": '{{ "#FFF" if not is_state("climate.ac_ac_finlux", "off") else "#000" }}'
          "bg_opa": '{{ "255" if not is_state("climate.ac_ac_finlux", "off") else "128" }}'
        event:
          "up":
            # Update temperature on AC card
            - service: openhasp.command
              target:
                entity_id: openhasp.plate04
              data:
                keyword: p2b75.text
                parameters: '{{ state_attr("climate.ac_ac_finlux", "temperature") | round(1) }}°C'
    
            # Open climate popup
            - service: script.plate_climate_popup
              data:
                entity_name: "Air Conditioner"
                entity_id: "climate.ac_ac_finlux"
                entity_icon: "\uE01B"
      - obj: "p2b72" # AC icon
        properties:
          "text_color": '{{ "#2196f3" if not is_state("climate.ac_ac_finlux", "off") else "#FFF" }}'
          "opacity": '{{ "255" if not is_state("climate.ac_ac_finlux", "off") else "128" }}'
      - obj: "p2b73" # AC label
        properties:
          "text_color": '{{ "#000" if not is_state("climate.ac_ac_finlux", "off") else "#FFF" }}'
          "opacity": '{{ "255" if not is_state("climate.ac_ac_finlux", "off") else "128" }}'
      - obj: "p2b74" # AC status
        properties:
          "text": >-
            {% if is_state("climate.ac_ac_finlux", "unavailable") %}
              N/A
            {% elif not is_state("climate.ac_ac_finlux", "off") %}
              {{ states("climate.ac_ac_finlux") | title }}
            {% else %}
              Off
            {% endif %}
          "text_color": '{{ "#000" if not is_state("climate.ac_ac_finlux", "off") and not is_state("climate.ac_ac_finlux", "unavailable") else "#FFF" }}'

      # Page 3: Bedroom
      - obj: "p3b11" # Bedroom temperature
        properties:
          "value_str": '{{ states("sensor.atc_fa91_temperature") | round(1) }}°C'
      - obj: "p3b21" # Bedroom humidity
        properties:
          "value_str": '{{ states("sensor.atc_fa91_humidity") | round(0) }}%'
      
      - obj: "p3b61" # Bedroom heater card
        properties:
          "bg_color": '{{ "#FFF" if is_state("climate.konvektor", "heat") else "#000" }}'
          "bg_opa": '{{ "255" if is_state("climate.konvektor", "heat") else "128" }}'
        event:
          "up":
            - service: script.plate_heater_popup
              data:
                entity_name: "Bedroom Heater"
                entity_id: "climate.konvektor"
                entity_icon: "\uE438"
      - obj: "p3b62" # Bedroom heater icon
        properties:
          "text_color": '{{ "#ff9e00" if is_state("climate.konvektor", "heat") else "#FFF" }}'
          "opacity": '{{ "255" if is_state("climate.konvektor", "heat") else "128" }}'
      - obj: "p3b63" # Bedroom heater label
        properties:
          "text_color": '{{ "#000" if is_state("climate.konvektor", "heat") else "#FFF" }}'
          "opacity": '{{ "255" if is_state("climate.konvektor", "heat") else "128" }}'
      - obj: "p3b64" # Bedroom heater status
        properties:
          "text": >
            {% if is_state("climate.konvektor", "unavailable") %}N/A
            {% elif is_state("climate.konvektor", "heat") %}{{ state_attr("climate.konvektor", "temperature") | round(1) }}°C
            {% else %}Off
            {% endif %}
          "text_color": '{{ "#000" if is_state("climate.konvektor", "heat") else "#FFF" }}'
      
      - obj: "p3b71" # Bedroom light card
        properties:
          "bg_color": '{{ "#FFF" if is_state("light.msl120_ebe9_light_bulb_2", "on") else "#000" }}'
          "bg_opa": '{{ "255" if is_state("light.msl120_ebe9_light_bulb_2", "on") else "128" }}'
        event:
          "up":
            - service: homeassistant.toggle
              target:
                entity_id: light.msl120_ebe9_light_bulb_2
          "hold":
            - service: script.plate_light_popup
              data:
                entity_name: "Bedroom Light"
                entity_id: "light.msl120_ebe9_light_bulb_2"
                entity_icon: "\uE335"
      - obj: "p3b72" # Bedroom light icon
        properties:
          "text_color": '{{ "#fb9b06" if is_state("light.msl120_ebe9_light_bulb_2", "on") else "#FFF" }}'
          "opacity": '{{ "255" if is_state("light.msl120_ebe9_light_bulb_2", "on") else "128" }}'
      - obj: "p3b73" # Bedroom light label
        properties:
          "text_color": '{{ "#000" if is_state("light.msl120_ebe9_light_bulb_2", "on") else "#FFF" }}'
          "opacity": '{{ "255" if is_state("light.msl120_ebe9_light_bulb_2", "on") else "128" }}'
      - obj: "p3b74" # Bedroom light status
        properties:
          "text": '{{ "On" if is_state("light.msl120_ebe9_light_bulb_2", "on") else "Off" }}'
          "text_color": '{{ "#000" if is_state("light.msl120_ebe9_light_bulb_2", "on") else "#FFF" }}'
      
      - obj: "p3b81" # Garland card
        properties:
          "bg_color": '{{ "#FFF" if is_state("switch.sonoff_1000d1da5e", "on") else "#000" }}'
          "bg_opa": '{{ "255" if is_state("switch.sonoff_1000d1da5e", "on") else "128" }}'
        event:
          "up":
            - service: homeassistant.toggle
              target:
                entity_id: switch.sonoff_1000d1da5e
      - obj: "p3b82" # Garland icon
        properties:
          "text_color": '{{ "#fb9b06" if is_state("switch.sonoff_1000d1da5e", "on") else "#FFF" }}'
          "opacity": '{{ "255" if is_state("switch.sonoff_1000d1da5e", "on") else "128" }}'
      - obj: "p3b83" # Garland label
        properties:
          "text_color": '{{ "#000" if is_state("switch.sonoff_1000d1da5e", "on") else "#FFF" }}'
          "opacity": '{{ "255" if is_state("switch.sonoff_1000d1da5e", "on") else "128" }}'
      - obj: "p3b84" # Garland status
        properties:
          "text": >-
            {% if is_state("switch.sonoff_1000d1da5e", "unavailable") %}
              N/A
            {% elif is_state("switch.sonoff_1000d1da5e", "on") %}
              On
            {% else %}
              Off
            {% endif %}
          "text_color": '{{ "#000" if is_state("switch.sonoff_1000d1da5e", "on") else "#FFF" }}'
      
      - obj: "p1b51" # Vacuum card
        properties:
          "bg_color": >
            {% set status = states('sensor.ijai_v1_642f_status') %}
            {% if status in ['cleaning', 'mopping', 'sweeping'] %}#4CAF50
            {% elif status == 'charging' %}#2196F3
            {% elif status == 'error' %}#FF0000
            {% else %}#000
            {% endif %}
          "bg_opa": >
            {% set status = states('sensor.ijai_v1_642f_status') %}
            {{ "255" if status not in ['idle', 'unavailable'] else "128" }}
        event:
          "up":
            - service: script.plate_vacuum_popup
              data:
                entity_name: "Vacuum Cleaner"
                entity_id: "sensor.ijai_v1_642f_status"
                entity_icon: "\uE70D"
      - obj: "p1b52" # Vacuum icon
        properties:
          "text_color": >
            {% set status = states('sensor.ijai_v1_642f_status') %}
            {% if status in ['cleaning', 'mopping', 'sweeping'] %}#4CAF50
            {% elif status == 'charging' %}#2196F3
            {% elif status == 'error' %}#FF0000
            {% else %}#ff9e00
            {% endif %}
      - obj: "p1b53" # Vacuum status
        properties:
          "text": '{{ states("sensor.ijai_v1_642f_battery_level") }}%'
      - obj: "p1b54" # Vacuum label
        properties:
          "text": '{{ states("sensor.ijai_v1_642f_status") | replace("_", " ") | title }}'
      
      - obj: "p1b61" # Timer card
        properties:
          "bg_color": >-
            {% if is_state("timer.timer_working", "active") %}#FFF
            {% else %}#000
            {% endif %}
          "bg_opa": >-
            {% if is_state("timer.timer_working", "active") %}255
            {% else %}128
            {% endif %}
        event:
          "up":
            - service: script.plate_timer_popup
              data:
                entity_name: "Timer"
                entity_id: "timer.timer_working"
                entity_icon: "\uE51B"
      - obj: "p1b62" # Timer icon
        properties:
          "text_color": >-
            {% if is_state("timer.timer_working", "active") %}#ff9e00
            {% else %}#FFF
            {% endif %}
          "opacity": >-
            {% if is_state("timer.timer_working", "active") %}255
            {% else %}128
            {% endif %}
      - obj: "p1b63" # Timer label
        properties:
          "text_color": >-
            {% if is_state("timer.timer_working", "active") %}#000
            {% else %}#FFF
            {% endif %}
          "opacity": >-
            {% if is_state("timer.timer_working", "active") %}255
            {% else %}128
            {% endif %}
      - obj: "p1b64" # Timer countdown
        properties:
          "text": >-
            {% if is_state("timer.timer_working", "active") %}
              {% set finish = state_attr("timer.timer_working", "finishes_at") %}
              {% if finish %}
                {{ as_timestamp(finish) | timestamp_custom('%H:%M', true) }}
              {% else %}
                {{ state_attr("timer.timer_working", "remaining") | string }}
              {% endif %}
            {% elif is_state("timer.timer_working", "paused") %}
              Paused
            {% else %}
              Off
            {% endif %}
          "text_color": >-
            {% if is_state("timer.timer_working", "active") %}#000
            {% else %}#FFF
            {% endif %}

      # Page 4: Bathroom
      - obj: "p4b11" # Bathroom temperature
        properties:
          "value_str": '{{ states("sensor.atc_5355_temperature") | round(1) }}°C'
      - obj: "p4b21" # Bathroom humidity
        properties:
          "value_str": '{{ states("sensor.atc_5355_humidity") | round(0) }}%'
      
      - obj: "p4b61" # Boiler card
        properties:
          "bg_color": '{{ "#FFF" if is_state("switch.boiler_switch", "on") else "#000" }}'
          "bg_opa": '{{ "255" if is_state("switch.boiler_switch", "on") else "128" }}'
        event:
          "up":
            - service: homeassistant.toggle
              target:
                entity_id: switch.boiler_switch
      - obj: "p4b62" # Boiler icon
        properties:
          "text_color": '{{ "#ff9e00" if is_state("switch.boiler_switch", "on") else "#FFF" }}'
          "opacity": '{{ "255" if is_state("switch.boiler_switch", "on") else "128" }}'
      - obj: "p4b63" # Boiler label
        properties:
          "text_color": '{{ "#000" if is_state("switch.boiler_switch", "on") else "#FFF" }}'
          "opacity": '{{ "255" if is_state("switch.boiler_switch", "on") else "128" }}'
      - obj: "p4b64" # Boiler status
        properties:
          "text": '{{ "On" if is_state("switch.boiler_switch", "on") else "Off" }}'
          "text_color": '{{ "#000" if is_state("switch.boiler_switch", "on") else "#FFF" }}'

      - obj: "p4b65" # Boiler power
        properties:
          "text": '{{ states("sensor.boiler_phase_a_power") | round(0) }} kW'
          "text_color": '{{ "#000" if is_state("switch.boiler_switch", "on") else "#FFF" }}'

      # Page 5: System
      - obj: "p5b61" # Restart panel button
        event:
          "up":
            - service: button.press
              target:
                entity_id: button.plate04_restart
      
      # Page 5: Brightness button
      - obj: "p5b71"
        event:
          "up":
            - service: script.plate_brightness_popup


      #############################
      ### Pop up event handlers ###
      #############################
      
      - obj: "p0b153" # pop-up close button
        event:
          "up":
            - service: openhasp.command
              target:
                entity_id: openhasp.plate04
              data:
                keyword: p0b150.delete
            - service: input_number.set_value
              data:
                value: 0
              target:
                entity_id:
                  - input_number.plate_timer_hour
                  - input_number.plate_timer_minute
            - service: input_text.set_value
              data:
                value: "Null"
              target:
                entity_id: input_text.plate_sel_entity

      - obj: "p0b155" # light popup: brightness slider
        event:
          "up":
            - service: light.turn_on
              data:
                entity_id: "{{ tag }}"
                brightness: "{{ val }}"

      # Climate popup: Temperature down button
      - obj: "p0b160"
        event:
          "up":
            - service: climate.set_temperature
              target:
                entity_id: '{{ states("input_text.plate_sel_entity") }}'
              data:
                temperature: >
                  {{ [state_attr(states('input_text.plate_sel_entity'), 'temperature') - 1, 
                      state_attr(states('input_text.plate_sel_entity'), 'min_temp')] | max }}
            - delay: 1
            
            # Update temperature on climate popup
            - service: openhasp.command
              target:
                entity_id: openhasp.plate04
              data:
                keyword: p0b161.text
                parameters: '{{ state_attr(states("input_text.plate_sel_entity"), "temperature") | round(1) }}°C'

             # Update temperature on card AC
            - service: openhasp.command
              target:
                entity_id: openhasp.plate04
              data:
                keyword: p2b75.text
                parameters: '{{ state_attr(states("input_text.plate_sel_entity"), "temperature") | round(1) }}°C'


      # Climate popup: Temperature up button
      - obj: "p0b162"
        event:
          "up":
            - service: climate.set_temperature
              target:
                entity_id: '{{ states("input_text.plate_sel_entity") }}'
              data:
                temperature: >
                  {{ [state_attr(states('input_text.plate_sel_entity'), 'temperature') + 1, 
                      state_attr(states('input_text.plate_sel_entity'), 'max_temp')] | min }}
            - delay: 1
            
            # Update temperature on climate popup
            - service: openhasp.command
              target:
                entity_id: openhasp.plate04
              data:
                keyword: p0b161.text
                parameters: '{{ state_attr(states("input_text.plate_sel_entity"), "temperature") | round(1) }}°C'
            
             # Update temperature on card AC
            - service: openhasp.command
              target:
                entity_id: openhasp.plate04
              data:
                keyword: p2b75.text
                parameters: '{{ state_attr(states("input_text.plate_sel_entity"), "temperature") | round(1) }}°C'

      # Climate popup: Power button
      - obj: "p0b170"
        event:
          "up":
            - service: >
                {% if is_state(states('input_text.plate_sel_entity'), 'off') or is_state(states('input_text.plate_sel_entity'), 'idle') %}
                  climate.turn_on
                {% else %}
                  climate.turn_off
                {% endif %}
              target:
                entity_id: '{{ states("input_text.plate_sel_entity") }}'

      # Climate popup: Auto mode button
      - obj: "p0b171"
        event:
          "up":
            - service: climate.set_hvac_mode
              target:
                entity_id: '{{ states("input_text.plate_sel_entity") }}'
              data:
                hvac_mode: auto

      # Climate popup: Cool mode button
      - obj: "p0b172"
        event:
          "up":
            - service: climate.set_hvac_mode
              target:
                entity_id: '{{ states("input_text.plate_sel_entity") }}'
              data:
                hvac_mode: cool

      # Climate popup: Heat mode button
      - obj: "p0b173"
        event:
          "up":
            - service: climate.set_hvac_mode
              target:
                entity_id: '{{ states("input_text.plate_sel_entity") }}'
              data:
                hvac_mode: heat

      # Climate popup: Fan only mode button
      - obj: "p0b174"
        event:
          "up":
            - service: climate.set_hvac_mode
              target:
                entity_id: '{{ states("input_text.plate_sel_entity") }}'
              data:
                hvac_mode: fan_only

      # Climate popup: Dry mode button
      - obj: "p0b176"
        event:
          "up":
            - service: climate.set_hvac_mode
              target:
                entity_id: '{{ states("input_text.plate_sel_entity") }}'
              data:
                hvac_mode: dry

      # Vacuum popup: Start sweep
      - obj: "p0b180"
        event:
          "up":
            - service: button.press
              target:
                entity_id: button.ijai_v1_642f_start_sweep

      # Vacuum popup: Start mop
      - obj: "p0b181"
        event:
          "up":
            - service: button.press
              target:
                entity_id: button.ijai_v1_642f_start_mop

      # Vacuum popup: Sweep + Mop
      - obj: "p0b182"
        event:
          "up":
            - service: button.press
              target:
                entity_id: button.ijai_v1_642f_start_sweep_mop

      # Vacuum popup: Only sweep
      - obj: "p0b183"
        event:
          "up":
            - service: button.press
              target:
                entity_id: button.ijai_v1_642f_start_only_sweep

      # Vacuum popup: Stop
      - obj: "p0b184"
        event:
          "up":
            - service: button.press
              target:
                entity_id: button.ijai_v1_642f_stop_sweeping

      # Vacuum popup: Charge
      - obj: "p0b185"
        event:
          "up":
            - service: button.press
              target:
                entity_id: button.ijai_v1_642f_start_charge

      # Vacuum popup: AI recognize toggle
      - obj: "p0b186"
        event:
          "up":
            - service: switch.toggle
              target:
                entity_id: switch.ijai_v1_642f_ai_recognize

      # Vacuum popup: Dirt recognize toggle
      - obj: "p0b187"
        event:
          "up":
            - service: switch.toggle
              target:
                entity_id: switch.ijai_v1_642f_dirt_recognize

      # Timer popup: Switch toggle (starts timer script)
      - obj: "p0b190"
        event:
          "up":
            - choose:
                - conditions:
                    - condition: state
                      entity_id: switch.chuangmi_212a01_039c_switch
                      state: 'off'
                  sequence:
                    - service: script.turn_on
                      target:
                        entity_id: script.socket_timer
              default:
                - service: switch.turn_off
                  target:
                    entity_id: switch.chuangmi_212a01_039c_switch
                - service: timer.cancel
                  target:
                    entity_id: timer.timer_working

      # Timer popup: Time down button
      - obj: "p0b191"
        event:
          "up":
            - service: input_number.set_value
              target:
                entity_id: input_number.time_working
              data:
                value: >-
                  {{ [states('input_number.time_working') | int - 5, 0] | max }}
            - delay: 0.2
            - service: openhasp.command
              target:
                entity_id: openhasp.plate04
              data:
                keyword: p0b192.text
                parameters: '{{ states("input_number.time_working") | int }} min'

      # Timer popup: Time up button
      - obj: "p0b193"
        event:
          "up":
            - service: input_number.set_value
              target:
                entity_id: input_number.time_working
              data:
                value: >-
                  {{ [states('input_number.time_working') | int + 5, 180] | min }}
            - delay: 0.2
            - service: openhasp.command
              target:
                entity_id: openhasp.plate04
              data:
                keyword: p0b192.text
                parameters: '{{ states("input_number.time_working") | int }} min'
      
      # Brightness popup: Light button
      - obj: "p0b200"
        event:
          "up":
            - service: light.turn_on
              target:
                entity_id: light.plate04_backlight
              data:
                brightness: 255
            - service: openhasp.command
              target:
                entity_id: openhasp.plate04
              data:
                keyword: p0b150.delete
      
      # Brightness popup: Dark button
      - obj: "p0b201"
        event:
          "up":
            - service: light.turn_on
              target:
                entity_id: light.plate04_backlight
              data:
                brightness: 217
            - service: openhasp.command
              target:
                entity_id: openhasp.plate04
              data:
                keyword: p0b150.delete

script:
